# Save as .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # change if your default branch is called something else
  workflow_dispatch: # also lets you run it by hand from the Actions tab

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci # use `npm install` if you don't commit package-lock.json

      - name: Build
        env:
          # https://<user>.github.io/<repo-name>/  →  base path is "/<repo-name>"
          # For a <user>.github.io repo, set this to '' instead.
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: |
          npm run build
          touch build/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
